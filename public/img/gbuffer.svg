<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 260" font-family="system-ui, sans-serif">
  <rect width="880" height="260" rx="12" fill="#f6f8fa"/>
  <text x="440" y="34" font-size="16" text-anchor="middle" fill="#334155" font-weight="600">延迟渲染：几何 pass 写 G-Buffer，光照 pass 逐像素读回</text>
  <g font-size="14" text-anchor="middle">
    <rect x="30" y="90" width="150" height="80" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="105" y="124" fill="#1e3a8a">几何 Pass</text>
    <text x="105" y="146" font-size="11" fill="#1e40af">每物体一次</text>
    <path d="M184 130 h36" stroke="#94a3b8" stroke-width="2" marker-end="url(#b)"/>
    <g font-size="12">
      <rect x="226" y="58" width="180" height="34" rx="6" fill="#fee2e2" stroke="#ef4444"/>
      <text x="316" y="80" fill="#7f1d1d">Albedo（基色）</text>
      <rect x="226" y="100" width="180" height="34" rx="6" fill="#dcfce7" stroke="#22c55e"/>
      <text x="316" y="122" fill="#14532d">Normal（法线）</text>
      <rect x="226" y="142" width="180" height="34" rx="6" fill="#e0e7ff" stroke="#6366f1"/>
      <text x="316" y="164" fill="#312e81">Roughness / Metallic</text>
      <rect x="226" y="184" width="180" height="34" rx="6" fill="#f1f5f9" stroke="#64748b"/>
      <text x="316" y="206" fill="#334155">Depth（深度）</text>
      <text x="316" y="240" fill="#64748b" font-size="11">G-Buffer：3-4 张全屏 RT（带宽大头）</text>
    </g>
    <path d="M410 130 h36" stroke="#94a3b8" stroke-width="2" marker-end="url(#b)"/>
    <rect x="452" y="90" width="150" height="80" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="527" y="124" fill="#78350f">光照 Pass</text>
    <text x="527" y="146" font-size="11" fill="#92400e">每像素 × 光源列表</text>
    <path d="M606 130 h36" stroke="#94a3b8" stroke-width="2" marker-end="url(#b)"/>
    <rect x="648" y="90" width="120" height="80" rx="8" fill="#dcfce7" stroke="#22c55e"/>
    <text x="708" y="124" fill="#14532d">帧缓冲</text>
    <text x="708" y="146" font-size="11" fill="#166534">透明物体前向补画</text>
  </g>
  <defs>
    <marker id="b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#94a3b8"/>
    </marker>
  </defs>
</svg>
