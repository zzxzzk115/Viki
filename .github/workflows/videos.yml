name: Fetch video feed

on:
  schedule:
    # 02:00 UTC = 10:00 CST. Scheduled workflows only fire on the default branch.
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: videos
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
      - name: Check out data branch into data/
        run: |
          git fetch --depth=1 origin data
          git checkout origin/data -- data
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Fetch subscribed videos
        run: pnpm videos

      - name: Commit to data branch
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch --depth=1 origin data
          git worktree add ../data-branch origin/data
          rm -rf ../data-branch/data/videos
          mkdir -p ../data-branch/data
          [ -d data/videos ] && cp -r data/videos ../data-branch/data/videos || true
          cd ../data-branch

          git add data
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "没有变化，跳过部署"
          else
            git commit -m "chore(videos): $(date -u +%F)"
            git push origin HEAD:data
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  redeploy:
    needs: fetch
    if: needs.fetch.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      pages: write
      id-token: write
