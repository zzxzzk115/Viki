name: Deploy to Pages

on:
  push:
    branches: [master]
  workflow_dispatch:
  # Lets arxiv.yml invoke this directly. A workflow run that pushes with the
  # repo GITHUB_TOKEN does NOT trigger a `push` workflow, so the cron job cannot
  # rely on its own commit to deploy — it has to call this seam explicitly.
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

# Stops a cron-triggered deploy and a push-triggered deploy from racing.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_BASE_PATH: /Viki
    steps:
      - uses: actions/checkout@v7

      # The paper feed lives on the orphan `data` branch so the cron's daily
      # commits stay out of master's history. Without this the build still
      # succeeds and /arxiv silently renders empty — so it is fetched
      # unconditionally rather than treated as optional.
      - name: Fetch data branch
        run: |
          git fetch --depth=1 origin data
          git checkout origin/data -- data
          echo "feed: $(cat data/papers/latest.json | head -c 60)…"

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
