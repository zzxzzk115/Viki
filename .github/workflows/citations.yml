name: Fetch citation graph

# Manual: run after adding papers to refresh the OpenAlex citation edges.
# Citations change rarely, so this is not on a schedule like the arXiv feed.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: citations
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v7

      # The graph data lives on the orphan `data` branch alongside the arXiv feed.
      - name: Check out data branch into data/
        run: |
          git fetch --depth=1 origin data
          git checkout origin/data -- data

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Fetch citations
        run: pnpm citations

      - name: Commit to data branch
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Commit data/citations to the data branch via a worktree, leaving the
          # checked-out master tree untouched (same as papers.yml).
          git fetch --depth=1 origin data
          git worktree add ../data-branch origin/data
          rm -rf ../data-branch/data/citations
          mkdir -p ../data-branch/data/citations
          cp -r data/citations/. ../data-branch/data/citations/
          cd ../data-branch

          git add data/citations
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "引用关系无变化，跳过部署"
          else
            git commit -m "chore(citations): $(date -u +%F)"
            git push origin HEAD:data
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  # GITHUB_TOKEN pushes don't trigger workflows, so call deploy.yml explicitly —
  # same seam as papers.yml.
  redeploy:
    needs: fetch
    if: needs.fetch.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      pages: write
      id-token: write
