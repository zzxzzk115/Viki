name: Fetch reading feed

on:
  schedule:
    # 01:30 UTC = 09:30 CST, half an hour after the paper feed. Scheduled
    # workflows only fire on the default branch.
    - cron: '30 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reading
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v7

      # Feed + daily word live on the orphan `data` branch, like the papers feed.
      - name: Check out data branch into data/
        run: |
          git fetch --depth=1 origin data
          git checkout origin/data -- data

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Both non-fatal: a source outage keeps the previous JSON and exits 0.
      - name: Fetch recommended reading
        run: pnpm reading
      - name: Fetch daily word
        run: pnpm word
      - name: Fetch listening clips
        run: pnpm listening

      - name: Commit to data branch
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch --depth=1 origin data
          git worktree add ../data-branch origin/data
          rm -rf ../data-branch/data/reading ../data-branch/data/vocab ../data-branch/data/listening
          mkdir -p ../data-branch/data
          [ -d data/reading ] && cp -r data/reading ../data-branch/data/reading || true
          [ -d data/vocab ] && cp -r data/vocab ../data-branch/data/vocab || true
          [ -d data/listening ] && cp -r data/listening ../data-branch/data/listening || true
          cd ../data-branch

          git add data
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "没有变化，跳过部署"
          else
            git commit -m "chore(reading): $(date -u +%F)"
            git push origin HEAD:data
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  # A GITHUB_TOKEN push does not trigger workflows, so call deploy.yml directly.
  redeploy:
    needs: fetch
    if: needs.fetch.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      pages: write
      id-token: write
